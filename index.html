<!DOCTYPE html>
<html>
<head>
  <title>Chat with LMStudio</title>
  <style>
    .chat-container { height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
    .chat-input-container { display: flex; gap: 10px; }
    .input-wrapper { flex-grow: 1; display: flex; gap: 10px; }
    #user-input { flex-grow: 1; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-messages" id="chat-messages"></div>
    <form id="chat-form" onsubmit="sendMessage(event)">
      <label>How can I help you?</label>
      <div class="chat-input-container">
        <div class="input-wrapper">
          <input type="text" id="user-input" placeholder="Type your message...">
        </div>
        <button type="submit">Send</button>
      </div>
    </form>
  </div>

  <script>
    async function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      
      if (!message) return;

      addMessage('User: ' + message);
      input.value = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (data.error)
          addMessage('Error: ' + data.error);
        else
          addMessage('Assistant: ' + data.response);
      } catch (error) {
        console.error('Error:', error);
        addMessage('Error: Failed to send message');
      }
    }

    function addMessage(message) {
      const messagesDiv = document.getElementById('chat-messages');
      const messageElement = document.createElement('div');
      
      const now = new Date();
      const timeString = now.toLocaleTimeString();
      
      if (message.startsWith('User: ')) {
        messageElement.textContent = `[${timeString}] ${message}`;
      } else if (message.startsWith('Assistant: ')) {
        const assistantContent = message.replace('Assistant: ', '');
        messageElement.innerHTML = `[${timeString}] Assistant: ` + marked.parse(assistantContent);
      } else {
        console.log("???:", message);
        messageElement.textContent = message;
      }
      
      messagesDiv.appendChild(messageElement);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
